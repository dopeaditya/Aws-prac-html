<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      min-height: 100vh;
      color: #fff;
    }

    .container {
      padding: 30px;
    }

    h1 {
      margin-bottom: 20px;
    }

    /* Stats Cards */
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      text-align: center;
    }

    .card h2 {
      font-size: 28px;
    }

    .card p {
      opacity: 0.8;
    }

    /* Table */
    .table-container {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px;
      text-align: left;
    }

    th {
      background: rgba(255,255,255,0.2);
    }

    tr:nth-child(even) {
      background: rgba(255,255,255,0.05);
    }

    tr:hover {
      background: rgba(255,255,255,0.2);
      transition: 0.3s;
    }

    .status {
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
    }

    .active {
      background: #00c853;
    }

    .inactive {
      background: #d50000;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Dashboard</h1>

    <!-- Stats -->
    <div class="stats">
      <div class="card">
        <h2>120</h2>
        <p>Total Users</p>
      </div>
      <div class="card">
        <h2>85</h2>
        <p>Active Users</p>
      </div>
      <div class="card">
        <h2>35</h2>
        <p>Inactive Users</p>
      </div>
    </div>

    <!-- Table -->
    <div class="table-container">
      <h2>User List</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>Aditya</td>
            <td>aditya@gmail.com</td>
            <td><span class="status active">Active</span></td>
          </tr>
          <tr>
            <td>2</td>
            <td>Rahul</td>
            <td>rahul@gmail.com</td>
            <td><span class="status inactive">Inactive</span></td>
          </tr>
          <tr>
            <td>3</td>
            <td>Sneha</td>
            <td>sneha@gmail.com</td>
            <td><span class="status active">Active</span></td>
          </tr>
          <tr>
            <td>4</td>
            <td>Anjali</td>
            <td>anjali@gmail.com</td>
            <td><span class="status active">Active</span></td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

</body>
</html>
